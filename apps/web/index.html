<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- TextLayer mark. ?v= busts favicons cached from upstream claude-view on the same origin. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=textlayer-1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=textlayer-1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=textlayer-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TextLayer Mission Control</title>
    <!-- Self-hosted variable fonts (Inter UI, Geist Mono code) — no render-blocking Google Fonts request -->
    <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/geist-mono-variable.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
